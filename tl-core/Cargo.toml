[package]
name = "tl-core"
version = "0.4.5"
edition = "2021"
license.workspace = true

[dependencies]
bytemuck = "1.17.1"
crossbeam.workspace = true
wgpu.workspace = true
winit.workspace = true
mps = { path = "../mps" }
paradoxpe = { path = "../paradoxpe" }
sxrc = { path = "../sxrc" }
nalgebra.workspace = true
wasm-encoder = "0.224.0"
miniz_oxide = "0.8.9"
pollster = "0.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38.0"
ash-window = "0.13.0"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2"
core-graphics-types = "0.2"
block = "0.1"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "gms_bench"
harness = false

[[bench]]
name = "mgs_bench"
harness = false
